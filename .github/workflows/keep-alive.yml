name: keep-alive

# Projetos Supabase gratuitos pausam após ~1 semana sem atividade
# (ARCHITECTURE §5). Este ping diário evita que o avaliador encontre
# o banco pausado semanas depois da entrega.
#
# Configure o secret API_HEALTH_URL apontando para:
#   https://<seu-projeto>.vercel.app/api/v1/health

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          URL="${{ secrets.API_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            echo "Secret API_HEALTH_URL não configurado."
            exit 1
          fi
          CODE=$(curl -s -o /tmp/body.json -w "%{http_code}" --max-time 30 "$URL")
          cat /tmp/body.json
          echo ""
          if [ "$CODE" != "200" ]; then
            echo "Esperado 200, recebido $CODE"
            exit 1
          fi
